          - generic [ref=f3e216]: "## Goal Take a feature idea from a plain description to a reviewed specification, an implementation plan, and a dependency-ordered task list, with no code written until you approve. ## Context - Module: Module_Dunnage ## Tools to use - `speckit.specify` — agent, .github/agents/speckit.specify.agent.md - `speckit.clarify` — agent, .github/agents/speckit.clarify.agent.md - `speckit.plan` — agent, .github/agents/speckit.plan.agent.md - `speckit.tasks` — agent, .github/agents/speckit.tasks.agent.md ## Steps 1. Write the specification from my description, and stop to ask me about anything underspecified rather than assuming. 2. Produce a plan that names the files it will touch, then a task list ordered by dependency. 3. Do not write or modify any code until I confirm the task list. ## House rules for this repo - Layering is View → ViewModel → Service → DAO → Database. No view model may call a DAO directly. - All business logic lives in the service layer, never in .xaml.cs code-behind. - MySQL writes go through stored procedures only. No raw MySQL SQL in C#. - Infor Visual SQL Server is read-only. Never issue INSERT, UPDATE, or DELETE against it. - XAML uses x:Bind only. Runtime {Binding} is not permitted. - DAOs return Model_Dao_Result or Model_Dao_Result<T> for expected failures instead of throwing. - Async method names end in Async. Tests use xUnit and FluentAssertions with names of the form MethodName_ShouldResult_WhenCondition. - When behaviour changes, update the matching docs under specs/, docs/, or the module Documentation folder. ## Done when - The solution builds: `dotnet build MTM_Receiving_Application.slnx`. - The relevant tests pass: `dotnet test MTM_Receiving_Application.Tests/MTM_Receiving_Application.Tests.csproj`. - No view model calls a DAO, and no business logic sits in code-behind. - Any new MySQL write goes through a stored procedure, and Infor Visual is untouched. - Affected documentation or spec files are updated. - You have told me what you changed and what you verified. ## Do not - Do not invent types, files, or stored procedures that do not already exist. Ask instead. - Do not change behaviour beyond what was asked, and do not do opportunistic cleanup. - Do not add NuGet packages, change database schema, or change dependency injection wiring without asking first. - Do not modify anything under Infor Visual or any SQL Server database. - Do not remove or rewrite existing tests to make a build pass. - Do not report work as complete unless you have built it and run the relevant tests."
