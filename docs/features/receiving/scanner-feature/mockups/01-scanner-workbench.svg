<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">Scanner View</title>
  <desc id="desc">Scanner workbench showing batch items, manage-items entry, and from/to warehouse and location mapping.</desc>
  <defs>
    <style>
      .app-shell { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1; }
      .titlebar { fill: #f7f7f8; }
      .nav-pane { fill: #f2f2f3; }
      .content-bg { fill: #fbfbfc; }
      .card { fill: #ffffff; stroke: #d5d7db; stroke-width: 1; }
      .subtle { fill: #f7f8fa; stroke: #dde0e5; stroke-width: 1; }
      .input { fill: #ffffff; stroke: #cfd4dc; stroke-width: 1; }
      .btn { fill: #ffffff; stroke: #c7ccd4; stroke-width: 1; }
      .btn-accent { fill: #1f6feb; stroke: #1a61d2; stroke-width: 1; }
      .chip { fill: #eef4ff; stroke: #b9d2ff; stroke-width: 1; }
      .chip-warn { fill: #fff7e8; stroke: #ffd28a; stroke-width: 1; }
      .chip-danger { fill: #fff1f2; stroke: #ffb4bf; stroke-width: 1; }
      .table-head { fill: #eef1f6; }
      .text-title { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #1f2328; }
      .text-h2 { font-family: Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2328; }
      .text-body { font-family: Segoe UI, Arial, sans-serif; font-size: 13px; fill: #344054; }
      .text-cap { font-family: Segoe UI, Arial, sans-serif; font-size: 11px; fill: #667085; }
      .text-btn { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
      .text-btn-accent { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #ffffff; }
      .text-nav { font-family: Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2328; }
    </style>
  </defs>
  <rect x="0" y="0" width="1450" height="900" class="app-shell"/>
  <rect x="0" y="0" width="1450" height="48" rx="14" class="titlebar"/>
  <rect x="0" y="34" width="1450" height="14" class="titlebar"/>
  <rect x="16" y="12" width="24" height="24" rx="4" class="subtle"/>
  <text x="52" y="29" class="text-body">MTM Receiving Application</text>
  <rect x="520" y="10" width="420" height="28" rx="6" class="input"/>
  <text x="536" y="29" class="text-cap">Search</text>
  <rect x="0" y="48" width="272" height="852" class="nav-pane"/>
  <text x="24" y="90" class="text-h2">Dashboard</text>
  <rect x="18" y="112" width="236" height="34" rx="6" class="chip"/>
  <text x="30" y="134" class="text-body">Receiving Labels</text>
  <rect x="272" y="48" width="1178" height="852" class="content-bg"/>
  <rect x="296" y="72" width="1130" height="72" rx="8" class="subtle"/>
  <text x="320" y="102" class="text-title">Scanner</text>
  <text x="320" y="124" class="text-cap">Prepare items and send them to inventory.</text>
  <rect x="970" y="84" width="214" height="34" rx="6" class="chip"/>
  <text x="988" y="106" class="text-body">System: Ready</text>
  <rect x="1198" y="84" width="206" height="34" rx="6" class="chip-warn"/>
  <text x="1214" y="106" class="text-body">Stop: Between Items</text>
  <rect x="308" y="168" width="960" height="112" rx="10" class="card"/>
  <text x="328" y="198" class="text-h2">Settings</text>
  <rect x="328" y="212" width="260" height="34" rx="6" class="input"/>
  <text x="340" y="233" class="text-cap">Session</text>
  <rect x="602" y="212" width="260" height="34" rx="6" class="input"/>
  <text x="614" y="233" class="text-cap">Profile</text>
  <rect x="876" y="212" width="170" height="34" rx="6" class="btn"/>
  <text x="925" y="233" class="text-btn">Save for Later</text>
  <rect x="1056" y="212" width="192" height="34" rx="6" class="btn"/>
  <text x="1085" y="233" class="text-btn">Load Saved</text>
  <rect x="308" y="294" width="620" height="440" rx="10" class="card"/>
  <text x="328" y="322" class="text-h2">Items to Send</text>
  <rect x="794" y="306" width="114" height="28" rx="6" class="btn"/>
  <text x="823" y="325" class="text-btn">Manage Items</text>
  <rect x="328" y="336" width="580" height="34" rx="6" class="table-head"/>
  <text x="338" y="358" class="text-cap">#</text>
  <text x="372" y="358" class="text-cap">Part</text>
  <text x="448" y="358" class="text-cap">From Whse</text>
  <text x="538" y="358" class="text-cap">From Loc</text>
  <text x="618" y="358" class="text-cap">To Whse</text>
  <text x="696" y="358" class="text-cap">To Loc</text>
  <text x="770" y="358" class="text-cap">Qty</text>
  <text x="820" y="358" class="text-cap">State</text>
  <rect x="328" y="378" width="580" height="44" class="input"/>
  <text x="338" y="406" class="text-body">1</text><text x="372" y="406" class="text-body">MMF-44001</text><text x="448" y="406" class="text-body">001</text><text x="538" y="406" class="text-body">A01</text><text x="618" y="406" class="text-body">002</text><text x="696" y="406" class="text-body">RECV-A01</text><text x="770" y="406" class="text-body">120</text>
  <rect x="808" y="386" width="56" height="26" rx="12" class="chip"/><text x="821" y="404" class="text-cap">Sent</text>
  <rect x="328" y="426" width="580" height="44" class="input"/>
  <text x="338" y="454" class="text-body">2</text><text x="372" y="454" class="text-body">MMF-45088</text><text x="448" y="454" class="text-body">001</text><text x="538" y="454" class="text-body">A01</text><text x="618" y="454" class="text-body">002</text><text x="696" y="454" class="text-body">RECV-A01</text><text x="770" y="454" class="text-body">95</text>
  <rect x="808" y="434" width="56" height="26" rx="12" class="chip-danger"/><text x="817" y="452" class="text-cap">Failed</text>
  <rect x="328" y="474" width="580" height="44" class="input"/>
  <text x="338" y="502" class="text-body">3</text><text x="372" y="502" class="text-body">MMF-46011</text><text x="448" y="502" class="text-body">001</text><text x="538" y="502" class="text-body">A01</text><text x="618" y="502" class="text-body">002</text><text x="696" y="502" class="text-body">RECV-A01</text><text x="770" y="502" class="text-body">72</text>
  <rect x="808" y="482" width="64" height="26" rx="12" class="subtle"/><text x="818" y="500" class="text-cap">Waiting</text>
  <rect x="328" y="530" width="580" height="188" rx="8" class="subtle"/>
  <text x="340" y="556" class="text-cap">Open Manage Items to add, edit, reorder, or remove batch items.</text>
  <text x="340" y="574" class="text-cap">Sent rows stay visible and read-only. Remaining rows stay waiting after first failure.</text>
  <rect x="942" y="294" width="326" height="440" rx="10" class="card"/>
  <text x="962" y="322" class="text-h2">Item Details</text>
  <text x="962" y="350" class="text-cap">Item Information</text>
  <rect x="962" y="360" width="286" height="30" rx="6" class="input"/><text x="974" y="380" class="text-cap">Part ID</text>
  <rect x="962" y="398" width="138" height="30" rx="6" class="subtle"/><text x="974" y="418" class="text-cap">From Whse</text>
  <rect x="1110" y="398" width="138" height="30" rx="6" class="input"/><text x="1122" y="418" class="text-cap">From Loc</text>
  <rect x="962" y="436" width="138" height="30" rx="6" class="subtle"/><text x="974" y="456" class="text-cap">To Whse</text>
  <rect x="1110" y="436" width="138" height="30" rx="6" class="input"/><text x="1122" y="456" class="text-cap">To Loc</text>
  <rect x="962" y="474" width="286" height="30" rx="6" class="input"/><text x="974" y="494" class="text-cap">Quantity</text>
  <text x="962" y="510" class="text-cap">Warehouse values come from settings and are read-only here.</text>
  <text x="962" y="522" class="text-cap">Issues</text>
  <rect x="962" y="532" width="286" height="54" rx="6" class="subtle"/>
  <text x="974" y="553" class="text-cap">1 issue with item 2</text>
  <text x="974" y="572" class="text-cap">Application not in foreground</text>
  <text x="962" y="610" class="text-cap">Progress</text>
  <rect x="962" y="620" width="88" height="56" rx="8" class="subtle"/><text x="992" y="640" class="text-cap">Sent</text><text x="996" y="660" class="text-h2">1</text>
  <rect x="1060" y="620" width="88" height="56" rx="8" class="subtle"/><text x="1080" y="640" class="text-cap">Failed</text><text x="1092" y="660" class="text-h2">1</text>
  <rect x="1158" y="620" width="88" height="56" rx="8" class="subtle"/><text x="1174" y="640" class="text-cap">Waiting</text><text x="1186" y="660" class="text-h2">7</text>
  <rect x="962" y="684" width="286" height="38" rx="6" class="chip-warn"/>
  <text x="974" y="708" class="text-cap">Stops work between items only.</text>
  <text x="962" y="730" class="text-cap">User manually validates and saves in ERP after send.</text>
  <rect x="308" y="748" width="960" height="104" rx="10" class="card"/>
  <text x="328" y="776" class="text-h2">Send Controls</text>
  <rect x="328" y="792" width="122" height="36" rx="6" class="btn"/><text x="352" y="815" class="text-btn">Check All</text>
  <rect x="460" y="792" width="138" height="36" rx="6" class="btn-accent"/><text x="485" y="815" class="text-btn-accent">Send</text>
  <rect x="608" y="792" width="142" height="36" rx="6" class="btn-accent"/><text x="646" y="815" class="text-btn-accent">Send All</text>
  <rect x="760" y="792" width="188" height="36" rx="6" class="btn"/><text x="788" y="815" class="text-btn">Stop After This</text>
  <rect x="958" y="792" width="130" height="36" rx="6" class="btn"/><text x="986" y="815" class="text-btn">Clear History</text>
  <rect x="1098" y="792" width="150" height="36" rx="6" class="btn"/><text x="1140" y="815" class="text-btn">Export</text>
</svg>