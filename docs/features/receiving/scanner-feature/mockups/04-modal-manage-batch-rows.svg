<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Manage Items Modal</title>
  <desc id="desc">Dialog for managing items with settings-driven warehouse values and editable location and quantity fields.</desc>
  <defs>
    <style>
      .modal-bg { fill: #000000; fill-opacity: 0.18; }
      .card { fill: #ffffff; stroke: #d5d7db; stroke-width: 1; }
      .subtle { fill: #f7f8fa; stroke: #dde0e5; stroke-width: 1; }
      .input { fill: #ffffff; stroke: #cfd4dc; stroke-width: 1; }
      .btn { fill: #ffffff; stroke: #c7ccd4; stroke-width: 1; }
      .btn-accent { fill: #1f6feb; stroke: #1a61d2; stroke-width: 1; }
      .chip-warn { fill: #fff7e8; stroke: #ffd28a; stroke-width: 1; }
      .table-head { fill: #eef1f6; }
      .text-title { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #1f2328; }
      .text-h2 { font-family: Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2328; }
      .text-body { font-family: Segoe UI, Arial, sans-serif; font-size: 13px; fill: #344054; }
      .text-cap { font-family: Segoe UI, Arial, sans-serif; font-size: 11px; fill: #667085; }
      .text-btn { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
      .text-btn-accent { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="700" class="modal-bg"/>
  <rect x="140" y="90" width="720" height="550" rx="12" class="card"/>
  <rect x="140" y="90" width="720" height="52" rx="12" class="subtle"/>
  <text x="160" y="125" class="text-title">Manage Items</text>
  <text x="160" y="154" class="text-cap">Add, edit, and reorder items before sending. Warehouse values come from settings.</text>
  <text x="160" y="170" class="text-cap">Edit From Location, To Location, and Quantity in the grid rows below.</text>
  <rect x="160" y="180" width="684" height="50" rx="8" class="subtle"/>
  <rect x="174" y="190" width="110" height="30" rx="6" class="btn"/><text x="205" y="210" class="text-btn">Add Item</text>
  <rect x="292" y="190" width="110" height="30" rx="6" class="btn"/><text x="323" y="210" class="text-btn">Duplicate</text>
  <rect x="410" y="190" width="110" height="30" rx="6" class="btn"/><text x="443" y="210" class="text-btn">Move Up</text>
  <rect x="528" y="190" width="110" height="30" rx="6" class="btn"/><text x="553" y="210" class="text-btn">Move Down</text>
  <rect x="646" y="190" width="94" height="30" rx="6" class="btn"/><text x="674" y="210" class="text-btn">Delete</text>
  <rect x="748" y="190" width="86" height="30" rx="6" class="btn"/><text x="767" y="210" class="text-btn">Import</text>
  <rect x="160" y="238" width="684" height="287" rx="8" class="input"/>
  <rect x="174" y="250" width="656" height="30" rx="6" class="table-head"/>
  <text x="182" y="270" class="text-cap">#</text>
  <text x="224" y="270" class="text-cap">Item</text>
  <text x="296" y="270" class="text-cap">From Whse</text>
  <text x="390" y="270" class="text-cap">From Loc</text>
  <text x="484" y="270" class="text-cap">To Whse</text>
  <text x="566" y="270" class="text-cap">To Loc</text>
  <text x="632" y="270" class="text-cap">Qty</text>
  <text x="684" y="270" class="text-cap">Status</text>
  <text x="746" y="270" class="text-cap">Notes</text>
  <rect x="174" y="288" width="656" height="34" class="input"/>
  <rect x="174" y="328" width="656" height="34" class="input"/>
  <rect x="174" y="368" width="656" height="34" class="input"/>
  <rect x="174" y="408" width="656" height="34" class="input"/>
  <text x="190" y="310" class="text-cap">Click cells in From Loc, To Loc, and Qty to edit.</text>
  <rect x="160" y="534" width="684" height="56" rx="8" class="chip-warn"/>
  <text x="174" y="554" class="text-cap">New items are checked against Infor Visual when added or edited.</text>
  <text x="174" y="572" class="text-cap">Status and Notes show fuzzy-match and quantity validation results. Warehouse values are read-only.</text>
  <rect x="682" y="608" width="96" height="32" rx="6" class="btn"/><text x="709" y="630" class="text-btn">Cancel</text>
  <rect x="744" y="608" width="100" height="32" rx="6" class="btn-accent"/><text x="778" y="630" class="text-btn-accent">Apply</text>
</svg>