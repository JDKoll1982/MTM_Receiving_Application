<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <rect width="1000" height="720" fill="#e8edf5"/>
  <rect x="40" y="40" width="920" height="640" rx="28" fill="#0f1720" opacity="0.08"/>
  <rect x="112" y="68" width="776" height="584" rx="24" fill="#ffffff" stroke="#d6dde8"/>
  <rect x="112" y="68" width="776" height="108" rx="24" fill="#0f6cbd"/>
  <text x="148" y="108" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="15" fill="#d9ecff">Add line</text>
  <text x="148" y="142" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Line Details</text>
  <text x="148" y="164" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" fill="#d9ecff">Capture the part, package count, and package-by-package quantities before saving the line.</text>

  <rect x="148" y="204" width="468" height="144" rx="18" fill="#fbfcfe" stroke="#d6dde8"/>
  <text x="172" y="232" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#243447">Part Information</text>
  <text x="172" y="258" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="13" fill="#5f6b7a">Part ID</text>
  <rect x="172" y="268" width="228" height="38" rx="12" fill="#f4f6fa" stroke="#d6dde8"/>
  <text x="188" y="292" font-family="Consolas, monospace" font-size="16" fill="#243447">ABC-1234</text>
  <rect x="416" y="268" width="176" height="38" rx="19" fill="#ffffff" stroke="#0f6cbd"/>
  <text x="455" y="292" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f6cbd">Part Match Helper</text>
  <rect x="172" y="316" width="168" height="24" rx="12" fill="#dff6dd"/>
  <text x="194" y="332" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b6a0b">Matched part ready</text>
  <text x="356" y="332" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="12" fill="#5f6b7a">Use the helper only if the typed part needs correction.</text>

  <rect x="632" y="204" width="220" height="144" rx="18" fill="#f6f9ff" stroke="#cfe1f7"/>
  <text x="656" y="232" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#243447">Package Count</text>
  <text x="656" y="258" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="13" fill="#5f6b7a">Number of packages</text>
  <rect x="656" y="268" width="96" height="38" rx="12" fill="#ffffff" stroke="#d6dde8"/>
  <text x="697" y="292" font-family="Consolas, monospace" font-size="18" fill="#243447">4</text>
  <text x="656" y="324" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="13" fill="#5f6b7a">Changing the count adds or removes package rows automatically.</text>

  <text x="148" y="392" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#243447">Package Quantities</text>
  <text x="148" y="414" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" fill="#5f6b7a">Each row represents one physical package on the line.</text>

  <rect x="148" y="436" width="484" height="164" rx="18" fill="#fbfcfe" stroke="#d6dde8"/>
  <text x="172" y="466" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#5f6b7a">PACKAGE</text>
  <text x="428" y="466" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#5f6b7a">QUANTITY</text>
  <rect x="164" y="482" width="452" height="28" rx="12" fill="#eef6ff" stroke="#9cc7f5"/>
  <text x="184" y="500" font-family="Consolas, monospace" font-size="15" fill="#243447">Package 1</text>
  <rect x="424" y="487" width="104" height="18" rx="9" fill="#ffffff" stroke="#cfd8e4"/>
  <text x="469" y="500" font-family="Consolas, monospace" font-size="14" fill="#243447">12</text>
  <rect x="164" y="518" width="452" height="28" rx="12" fill="#ffffff"/>
  <text x="184" y="536" font-family="Consolas, monospace" font-size="15" fill="#243447">Package 2</text>
  <rect x="424" y="523" width="104" height="18" rx="9" fill="#ffffff" stroke="#cfd8e4"/>
  <text x="469" y="536" font-family="Consolas, monospace" font-size="14" fill="#243447">10</text>
  <rect x="164" y="554" width="452" height="28" rx="12" fill="#ffffff"/>
  <text x="184" y="572" font-family="Consolas, monospace" font-size="15" fill="#243447">Package 3</text>
  <rect x="424" y="559" width="104" height="18" rx="9" fill="#ffffff" stroke="#cfd8e4"/>
  <text x="469" y="572" font-family="Consolas, monospace" font-size="14" fill="#243447">15</text>
  <rect x="164" y="590" width="452" height="-6" rx="0" fill="none"/>

  <rect x="652" y="436" width="200" height="164" rx="18" fill="#f6f9ff" stroke="#cfe1f7"/>
  <text x="676" y="464" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#243447">Entry Guidance</text>
  <text x="676" y="492" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" fill="#5f6b7a">Use one row per package.</text>
  <text x="676" y="516" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" fill="#5f6b7a">Package quantities can differ from one another.</text>
  <text x="676" y="540" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" fill="#5f6b7a">The request screen shows the line summary after save.</text>
  <rect x="676" y="564" width="148" height="24" rx="12" fill="#e8f2ff"/>
  <text x="706" y="580" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f6cbd">Modal only entry</text>

  <rect x="164" y="590" width="452" height="-2" rx="0" fill="none"/>
  <rect x="164" y="590" width="452" height="28" rx="12" fill="#ffffff"/>
  <text x="184" y="608" font-family="Consolas, monospace" font-size="15" fill="#243447">Package 4</text>
  <rect x="424" y="595" width="104" height="18" rx="9" fill="#ffffff" stroke="#cfd8e4"/>
  <text x="472" y="608" font-family="Consolas, monospace" font-size="14" fill="#243447">9</text>

  <rect x="572" y="612" width="120" height="36" rx="18" fill="#ffffff" stroke="#d6dde8"/>
  <text x="612" y="635" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#243447">Cancel</text>
  <rect x="708" y="612" width="144" height="36" rx="18" fill="#107c10"/>
  <text x="745" y="635" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Save To Request</text>
</svg>