<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#f4f6f8"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="44" fill="#1d4ed8"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="white">Module_OutsideService  ›  New Request</text>

  <!-- Screen label -->
  <text x="20" y="68" font-size="11" fill="#6b7280">Screen 1 — Request Entry  |  Role: Outside Service Coordinator</text>

  <!-- Request header card -->
  <rect x="20" y="80" width="760" height="90" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="36" y="103" font-size="12" font-weight="bold" fill="#374151">Request Header</text>
  <text x="36" y="125" font-size="11" fill="#6b7280">Request Notes (optional)</text>
  <rect x="36" y="132" width="520" height="28" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="44" y="151" font-size="11" fill="#9ca3af">e.g. Rush shipment — parts needed back by Friday</text>

  <!-- Lines section header -->
  <text x="20" y="196" font-size="12" font-weight="bold" fill="#374151">Lines Added To This Request</text>
  <text x="20" y="212" font-size="11" fill="#6b7280">Each row is one part with one or more packages. Quantities per package are stored individually.</text>

  <!-- Table header -->
  <rect x="20" y="220" width="760" height="30" rx="0" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="36" y="240" font-size="11" font-weight="bold" fill="#374151">Part ID</text>
  <text x="200" y="240" font-size="11" font-weight="bold" fill="#374151">Pkg Count</text>
  <text x="310" y="240" font-size="11" font-weight="bold" fill="#374151">Package Quantities</text>
  <text x="620" y="240" font-size="11" font-weight="bold" fill="#374151">Action</text>

  <!-- Row 1 -->
  <rect x="20" y="250" width="760" height="36" fill="white" stroke="#e5e7eb"/>
  <text x="36" y="273" font-size="11" fill="#111827">A123-456</text>
  <text x="200" y="273" font-size="11" fill="#111827">4</text>
  <text x="310" y="273" font-size="11" fill="#111827">Pkg 1: 10  |  Pkg 2: 15  |  Pkg 3: 8  |  Pkg 4: 20</text>
  <rect x="618" y="257" width="60" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="635" y="272" font-size="10" fill="#374151">Remove</text>

  <!-- Row 2 -->
  <rect x="20" y="286" width="760" height="36" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="36" y="309" font-size="11" fill="#111827">B789-012</text>
  <text x="200" y="309" font-size="11" fill="#111827">2</text>
  <text x="310" y="309" font-size="11" fill="#111827">Pkg 1: 50  |  Pkg 2: 50</text>
  <rect x="618" y="293" width="60" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="635" y="308" font-size="10" fill="#374151">Remove</text>

  <!-- Empty row placeholder -->
  <rect x="20" y="322" width="760" height="36" fill="white" stroke="#e5e7eb" stroke-dasharray="4,2"/>
  <text x="320" y="345" font-size="11" fill="#9ca3af">Add more lines using the button below</text>

  <!-- Add Line button -->
  <rect x="20" y="376" width="130" height="34" rx="6" fill="#1d4ed8"/>
  <text x="32" y="398" font-size="12" font-weight="bold" fill="white">+ Add Line</text>
  <text x="162" y="398" font-size="10" fill="#6b7280">Opens the Add Line modal to enter a part, package count, and per-package quantities</text>

  <!-- Save Request button area -->
  <rect x="0" y="540" width="800" height="60" fill="white" stroke="#e5e7eb"/>
  <text x="20" y="567" font-size="11" fill="#6b7280">At least one line is required before saving.</text>
  <rect x="620" y="549" width="140" height="36" rx="6" fill="#16a34a"/>
  <text x="648" y="573" font-size="12" font-weight="bold" fill="white">Save Request</text>

  <!-- Note callout -->
  <rect x="20" y="428" width="540" height="96" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="36" y="449" font-size="11" font-weight="bold" fill="#1d4ed8">Per-Package Quantity Rule</text>
  <text x="36" y="467" font-size="11" fill="#1e40af">Each package row on a line holds its own quantity value.</text>
  <text x="36" y="484" font-size="11" fill="#1e40af">Line 1 (A123-456) has 4 packages with quantities 10, 15, 8, and 20.</text>
  <text x="36" y="501" font-size="11" fill="#1e40af">These are stored as four separate records — not summed, not averaged.</text>
  <text x="36" y="518" font-size="11" fill="#1e40af">Packages on the same line can always have different quantities.</text>
</svg>
