<!--
  Release row template for docs/updates/index.html.
  Insert as the FIRST <tr> inside the <tbody> of table.release-table so the newest release stays
  at the top. Replace every [PLACEHOLDER]. The summary is one sentence in operator language and
  must not contradict the version page.
-->
<tr>
    <td><a class="release-link" href="[VERSION]/index.html"><strong>[VERSION]</strong></a></td>
    <td>[MONTH DD, YYYY]</td>
    <td>[ONE_SENTENCE_SUMMARY_OF_THE_RELEASE]</td>
</tr>
